version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns:
          - react
          - react-dom
          - react-router-dom
          - vite
          - "@vitejs/*"
      tooling:
        patterns:
          - typescript
          - eslint
          - prettier
          - vitest
          - tsx

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
    open-pull-requests-limit: 5
