name: Feature Branch Checks

on:
  push:
    branches:
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "hotfix-*"
      - "security/**"
      - "ci/**"
      - "chore/**"
      - "docs/**"
      - "refactor/**"
      - "test/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-branch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Feature workspace checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify branch name
        env:
          PR_HEAD_BRANCH: ${{ github.ref_name }}
        run: pnpm pr:check-branch-name

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Local secret scanner
        run: pnpm security:secrets

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: pnpm audit
        run: pnpm security:audit

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Validate app Compose profile
        run: docker compose --env-file .env.example --profile apps config --quiet

  dockerfiles:
    name: Dockerfile check (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: po-ui
            dockerfile: po-ui/Dockerfile
          - service: po-api-gateway
            dockerfile: po-api-gateway/Dockerfile
          - service: po-auth-project-service
            dockerfile: po-auth-project-service/Dockerfile
          - service: po-ingestion-service
            dockerfile: po-ingestion-service/Dockerfile
          - service: po-event-workers
            dockerfile: po-event-workers/Dockerfile
          - service: po-incident-service
            dockerfile: po-incident-service/Dockerfile
          - service: po-realtime-gateway
            dockerfile: po-realtime-gateway/Dockerfile
          - service: po-vault-service
            dockerfile: po-vault-service/Dockerfile
          - service: po-audit-service
            dockerfile: po-audit-service/Dockerfile
          - service: po-ops-service
            dockerfile: po-ops-service/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Dockerfile
        run: docker buildx build --check -f "${{ matrix.dockerfile }}" .
