name: Container Images

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: po-ui
            dockerfile: po-ui/Dockerfile
          - service: po-api-gateway
            dockerfile: po-api-gateway/Dockerfile
          - service: po-auth-project-service
            dockerfile: po-auth-project-service/Dockerfile
          - service: po-ingestion-service
            dockerfile: po-ingestion-service/Dockerfile
          - service: po-event-workers
            dockerfile: po-event-workers/Dockerfile
          - service: po-incident-service
            dockerfile: po-incident-service/Dockerfile
          - service: po-realtime-gateway
            dockerfile: po-realtime-gateway/Dockerfile
          - service: po-vault-service
            dockerfile: po-vault-service/Dockerfile
          - service: po-audit-service
            dockerfile: po-audit-service/Dockerfile
          - service: po-ops-service
            dockerfile: po-ops-service/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image owner
        id: image-owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ steps.image-owner.outputs.owner }}/pulse-ops-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ steps.image-owner.outputs.owner }}/pulse-ops-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
