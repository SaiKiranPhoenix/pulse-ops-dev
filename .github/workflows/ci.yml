name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/pulseops
      REDIS_URL: redis://redis:6379
      RABBITMQ_DEFAULT_USER: pulseops_ci
      RABBITMQ_DEFAULT_PASS: set-local-rabbitmq-password
      RABBITMQ_URL: amqp://pulseops_ci:set-local-rabbitmq-password@rabbitmq:5672
      JWT_SECRET: set-local-jwt-secret-minimum-32-characters

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate app Compose profile
        run: docker compose --profile apps config --quiet
