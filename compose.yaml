name: pulse-ops

services:
  po-ui:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: po-ui/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      - po-api-gateway
      - po-realtime-gateway

  po-api-gateway:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: po-api-gateway/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_GATEWAY_PORT:-4000}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "4000:4000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  po-auth-project-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: po-auth-project-service/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${AUTH_PROJECT_SERVICE_PORT:-4010}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    expose:
      - "4010"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  po-ingestion-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: po-ingestion-service/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${INGESTION_SERVICE_PORT:-4100}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    expose:
      - "4100"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  po-event-workers:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: po-event-workers/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${EVENT_WORKERS_PORT:-4110}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    expose:
      - "4110"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  po-incident-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: po-incident-service/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${INCIDENT_SERVICE_PORT:-4120}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    expose:
      - "4120"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  po-realtime-gateway:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: po-realtime-gateway/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${REALTIME_GATEWAY_PORT:-4130}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "4130:4130"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  po-vault-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: po-vault-service/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${VAULT_SERVICE_PORT:-4200}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      VAULT_KDF: ${VAULT_KDF:-argon2id}
    expose:
      - "4200"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  po-audit-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: po-audit-service/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${AUDIT_SERVICE_PORT:-4140}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    expose:
      - "4140"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  po-ops-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: po-ops-service/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${OPS_SERVICE_PORT:-4150}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    expose:
      - "4150"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mongodb:
    image: mongo:7
    container_name: pulseops-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - pulseops_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulseops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pulseops_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pulseops-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - pulseops_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: pulseops-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pulseops_mongodb_data:
  pulseops_redis_data:
  pulseops_rabbitmq_data:
